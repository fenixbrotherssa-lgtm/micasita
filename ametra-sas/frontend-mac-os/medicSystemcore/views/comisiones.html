<div class="com-wrapper" style="animation: fadeIn 0.5s ease; padding: 25px; background: #f1f5f9; min-height: 100vh;">

    <!-- HEADER -->

            </button>
            <div>
                <h1 style="font-size: 24px; font-weight: 800; color: #1e293b; margin: 0;">Comisiones de Doctores</h1>
                <p style="color: #64748b; margin: 5px 0 0 0; font-size: 14px;">Calculadas sobre lo cobrado · % por doctor y especialidad</p>
            </div>
        </div>

        <div style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
            <div id="com-container-clinica" style="display: none; flex-direction: column; min-width: 200px;">
                <label style="font-size: 10px; font-weight: 800; color: #4f46e5; margin-bottom: 5px; text-transform: uppercase;">Sede / Clínica</label>
                <select id="com-clinica" onchange="window.comisionesModule.recargar()" style="padding: 10px; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Inter'; font-weight: 600; color: #1e293b; background: #f8fafc;"></select>
            </div>
            <div style="display: flex; flex-direction: column;">

                    <input type="date" id="com-fecha-inicio" style="border: none; background: transparent; padding: 8px; font-family: 'Inter';">
                    <span style="align-self: center; color: #cbd5e1; margin: 0 10px;">al</span>
                    <input type="date" id="com-fecha-fin" style="border: none; background: transparent; padding: 8px; font-family: 'Inter';">
                </div>
            </div>
            <button onclick="window.comisionesModule.recargar()" style="background: #4f46e5; color: white; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; height: 48px;" title="Actualizar">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- PESTAÑAS -->
    <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button class="com-tab" data-tab="pendientes" onclick="window.comisionesModule.tab('pendientes')"><i class="fas fa-hourglass-half"></i> Pendientes por liquidar</button>
        <button class="com-tab" data-tab="config" onclick="window.comisionesModule.tab('config')"><i class="fas fa-percent"></i> % por doctor y especialidad</button>
        <button class="com-tab" data-tab="historial" onclick="window.comisionesModule.tab('historial')"><i class="fas fa-history"></i> Liquidaciones pagadas</button>
    </div>

    <div id="com-panel-pendientes" class="com-panel"></div>
    <div id="com-panel-config" class="com-panel" style="display:none;"></div>
    <div id="com-panel-historial" class="com-panel" style="display:none;"></div>
</div>
