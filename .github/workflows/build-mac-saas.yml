name: Build macOS SaaS Desktop

# Solo el cliente de escritorio (DMG) — a diferencia de build-mac.yml (on-premise), esta
# versión no arma un .pkg de backend: en el modelo SaaS el Mac no corre su propio backend
# ni SQL Server, solo se conecta por internet al servidor central (ver config.json —
# URL_PRODUCCION apunta a ametra.casrodsoft.com, no a 127.0.0.1).
on:
  push:
    branches: [main]
    paths:
      - 'ametra-sas/frontend-mac-os/medicSystemcore/**'
      - '.github/workflows/build-mac-saas.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac-saas:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias del frontend
        working-directory: ametra-sas/frontend-mac-os/medicSystemcore
        run: npm ci

      - name: Convertir icon.ico → icon.icns (si no existe .icns)
        working-directory: ametra-sas/frontend-mac-os/medicSystemcore/assets
        run: |
          if [ ! -f icon.icns ]; then
            if [ -f icon.png ]; then
              mkdir -p icon.iconset
              sips -z 16   16   icon.png --out icon.iconset/icon_16x16.png
              sips -z 32   32   icon.png --out icon.iconset/icon_16x16@2x.png
              sips -z 32   32   icon.png --out icon.iconset/icon_32x32.png
              sips -z 64   64   icon.png --out icon.iconset/icon_32x32@2x.png
              sips -z 128  128  icon.png --out icon.iconset/icon_128x128.png
              sips -z 256  256  icon.png --out icon.iconset/icon_128x128@2x.png
              sips -z 256  256  icon.png --out icon.iconset/icon_256x256.png
              sips -z 512  512  icon.png --out icon.iconset/icon_256x256@2x.png
              sips -z 512  512  icon.png --out icon.iconset/icon_512x512.png
              sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
              iconutil -c icns icon.iconset -o icon.icns
              rm -rf icon.iconset
              echo "icon.icns generado desde icon.png"
            else
              echo "AVISO: No se encontró icon.png ni icon.icns. El build usará el ícono por defecto de Electron."
              sed -i '' '/"icon": "assets\/icon.icns"/d' ../package.json
            fi
          else
            echo "icon.icns ya existe, se usa directamente."
          fi

      - name: Compilar DMG (x64 + arm64)
        working-directory: ametra-sas/frontend-mac-os/medicSystemcore
        run: npx electron-builder --mac --publish never

      - name: Subir DMG (app de escritorio SaaS)
        uses: actions/upload-artifact@v4
        with:
          name: AmetraOS-SaaS-Desktop-Mac
          path: ametra-sas/frontend-mac-os/medicSystemcore/dist/*.dmg
